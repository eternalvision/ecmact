name: Pages

on:
  push:
    branches: [main]
    paths:
      - 'packages/create-ecmact/template/**'
      - 'src/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - uses: actions/configure-pages@v6
      - run: npm ci
      - run: npm run build:all
      - name: Build the starter template
        run: |
          npm pack --pack-destination "$RUNNER_TEMP" --silent
          node packages/create-ecmact/bin/create-ecmact.mjs "$RUNNER_TEMP/demo" --no-tailwind --yes
          cd "$RUNNER_TEMP/demo"
          npm install "$RUNNER_TEMP"/ecmact-*.tgz --no-audit --no-fund
          npx vite build --base=/ecmact/
          cp dist/index.html dist/404.html
      - uses: actions/upload-pages-artifact@v4
        with:
          path: ${{ runner.temp }}/demo/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
