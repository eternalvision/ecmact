name: Pages

on:
  push:
    branches: [main]
    paths:
      - 'packages/create-ecmact/template/**'
      - 'src/**'
      - 'packages/site/**'
      - '.github/workflows/pages.yml'
      - '.github/pages/**'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - uses: actions/configure-pages@v6
      - run: npm ci
      - run: npm run build:all
      - name: Assemble the site, the starter and the widget demo
        run: |
          npm pack --pack-destination "$RUNNER_TEMP" --silent
          scaffold() {
            node packages/create-ecmact/bin/create-ecmact.mjs "$RUNNER_TEMP/$1" --template "$2" --yes
            (cd "$RUNNER_TEMP/$1" && npm install "$RUNNER_TEMP"/ecmact-*.tgz --no-audit --no-fund)
          }
          mkdir -p "$RUNNER_TEMP/site/starter" "$RUNNER_TEMP/site/widget"
          cp -r packages/site/dist/. "$RUNNER_TEMP/site/"
          cp packages/site/dist/index.html "$RUNNER_TEMP/site/404.html"
          scaffold ecmact-app app
          (cd "$RUNNER_TEMP/ecmact-app" && npx vite build --base=/ecmact/starter/)
          cp -r "$RUNNER_TEMP/ecmact-app/dist/." "$RUNNER_TEMP/site/starter/"
          scaffold ecmact-widget widget
          (cd "$RUNNER_TEMP/ecmact-widget" && npx vite build --base=/ecmact/widget/ && npx vite build --config vite.widget.config.ts)
          cp -r "$RUNNER_TEMP/ecmact-widget/dist/." "$RUNNER_TEMP/site/widget/"
          mv "$RUNNER_TEMP/site/widget/widget/price-widget.js" "$RUNNER_TEMP/site/widget/price-widget.js"
          rm -rf "$RUNNER_TEMP/site/widget/widget"
          cp .github/pages/embed.html "$RUNNER_TEMP/site/widget/embed.html"
      - uses: actions/upload-pages-artifact@v4
        with:
          path: ${{ runner.temp }}/site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
