name: Release create-ecmact

on:
  push:
    tags: ['create-ecmact-v*']

permissions:
  contents: write
  id-token: write
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org
      - name: Check the tag matches package.json
        run: test "create-ecmact-v$(node -p "require('./packages/create-ecmact/package.json').version")" = "$GITHUB_REF_NAME"
      - run: npm install -g npm@latest
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm publish -w create-ecmact
      - name: Publish to GitHub Packages
        run: |
          npm config set //npm.pkg.github.com/:_authToken "$NODE_AUTH_TOKEN"
          node scripts/github-package.mjs packages/create-ecmact
          npm publish -w create-ecmact --registry=https://npm.pkg.github.com --provenance=false
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Create GitHub release
        run: gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --generate-notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
